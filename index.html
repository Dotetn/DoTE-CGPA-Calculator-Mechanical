<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Engineering CGPA Calculator</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-blue: #eff6ff;
            --accent-border: #bfdbfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 500;
            margin-top: 5px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            background-color: #f1f5f9;
            padding: 8px 16px;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            margin: 20px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .student-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .student-info {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .input-group input {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* Tabs Interface */
        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #f1f5f9;
            border: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Subject Table Setup */
        .subject-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .subject-table th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
            font-size: 13px;
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .subject-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .subject-table input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .subject-table select, .subject-table input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }

        .btn-calculate {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s;
        }

        .btn-calculate:hover {
            background-color: var(--primary-hover);
        }

        /* Results Display Dashboard */
        .results-dashboard {
            margin-top: 30px;
            display: none;
        }

        .student-meta-output {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
            color: var(--text-main);
        }

        .gpa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .gpa-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .gpa-card .title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .gpa-card .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .summary-box {
            background-color: var(--accent-blue);
            border: 2px solid var(--accent-border);
            border-radius: 10px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            text-align: center;
        }

        @media (max-width: 500px) {
            .summary-box {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        .summary-stat .label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .summary-stat .score {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Department of Mechanical Engineering</h1>
        <p>CGPA & Percentage Calculator</p>
    </div>

    <div class="section-title">Student Credentials</div>
    <div class="student-info">
        <div class="input-group">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">
        </div>
        <div class="input-group">
            <label for="regNumber">Register Number</label>
            <input type="text" id="regNumber" placeholder="Enter registration number">
        </div>
    </div>

    <div class="section-title">Semester Course Data Entry</div>
    
    <div class="tabs-nav" id="tabsNav">
        <!-- Tabs generated dynamically via JS -->
    </div>

    <div id="tabsContent">
        <!-- Tab contents generated dynamically via JS -->
    </div>

    <button class="btn-calculate" onclick="calculateMetrics()">Calculate Final Metrics</button>

    <div class="results-dashboard" id="resultsDashboard">
        <div class="section-title">Performance Metrics Dashboard</div>
        <div class="student-meta-output" id="studentMetaOutput"></div>
        
        <div class="gpa-grid" id="gpaGrid">
            <!-- GPA breakdown cards generated via JS -->
        </div>

        <div class="summary-box">
            <div class="summary-stat">
                <div class="label">Overall Cumulative CGPA</div>
                <div class="score" id="cgpaScore">0.00</div>
            </div>
            <div class="summary-stat">
                <div class="label">Overall Percentage</div>
                <div class="score" id="percentageScore">0.00%</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Exact credit configurations extracted sequentially from the reference layout blueprint
    const semesterDefaults = {
        1: [2, 4, 3, 3, 2, 2, 2, 0],
        2: [2, 3, 2, 3, 2, 2, 2, 2, 0],
        3: [3, 4, 2, 3, 3, 3, 0],
        4: [3, 3, 2, 3, 3, 3, 0],
        5: [3, 4, 3, 3, 3, 2, 2, 2],
        6: [3, 3, 12]
    };

    const gradeScale = {
        "O": 10,
        "A+": 9,
        "A": 8,
        "B+": 7,
        "B": 6,
        "C": 5,
        "RA / U": 0
    };

    // Render HTML tabs structures dynamically
    const tabsNav = document.getElementById('tabsNav');
    const tabsContent = document.getElementById('tabsContent');

    Object.keys(semesterDefaults).forEach((sem, index) => {
        // Tab button
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        btn.textContent = `Sem ${sem}`;
        btn.onclick = () => switchTab(sem);
        btn.setAttribute('data-sem', sem);
        tabsNav.appendChild(btn);

        // Tab Content Pane
        const pane = document.createElement('div');
        pane.className = `tab-content ${index === 0 ? 'active' : ''}`;
        pane.id = `semPane-${sem}`;

        let tableHtml = `
            <table class="subject-table">
                <thead>
                    <tr>
                        <th style="width: 40%;">Subject Name</th>
                        <th style="width: 30%;">Grade</th>
                        <th style="width: 30%;">Credits (Typable)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        semesterDefaults[sem].forEach((defaultCredit, subIndex) => {
            let optionsHtml = Object.keys(gradeScale).map(g => `<option value="${g}">${g}</option>`).join('');
            tableHtml += `
                <tr>
                    <td><input type="text" value="Subject ${subIndex + 1}"></td>
                    <td>
                        <select class="grade-input" data-sem="${sem}" data-idx="${subIndex}">
                            ${optionsHtml}
                        </select>
                    </td>
                    <td>
                        <input type="number" class="credit-input" data-sem="${sem}" data-idx="${subIndex}" value="${defaultCredit}" min="0" max="20" step="1">
                    </td>
                </tr>
            `;
        });

        tableHtml += `</tbody></table>`;
        pane.innerHTML = tableHtml;
        tabsContent.appendChild(pane);
    });

    function switchTab(semId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(pane => pane.classList.remove('active'));

        document.querySelector(`.tab-btn[data-sem="${semId}"]`).classList.add('active');
        document.getElementById(`semPane-${semId}`).classList.add('active');
    }

    function calculateMetrics() {
        let totalWeightedPoints = 0;
        let totalCredits = 0;
        let semesterStats = {};

        Object.keys(semesterDefaults).forEach(sem => {
            let semWeightedPoints = 0;
            let semCredits = 0;

            const grades = document.querySelectorAll(`.grade-input[data-sem="${sem}"]`);
            const credits = document.querySelectorAll(`.credit-input[data-sem="${sem}"]`);

            grades.forEach((gradeSelect, idx) => {
                const gradeValue = gradeScale[gradeSelect.value];
                const creditValue = parseFloat(credits[idx].value) || 0;

                semWeightedPoints += gradeValue * creditValue;
                semCredits += creditValue;
            });

            if (semCredits > 0) {
                semesterStats[sem] = semWeightedPoints / semCredits;
                totalWeightedPoints += semWeightedPoints;
                totalCredits += semCredits;
            } else {
                semesterStats[sem] = 0;
            }
        });

        // Render data values directly onto UI dashboards
        if (totalCredits > 0) {
            const finalCgpa = totalWeightedPoints / totalCredits;
            const finalPercentage = finalCgpa * 10;

            // Student Info Header line
            const nameVal = document.getElementById('studentName').value.trim();
            const regVal = document.getElementById('regNumber').value.trim();
            const metaDiv = document.getElementById('studentMetaOutput');
            
            if (nameVal || regVal) {
                metaDiv.textContent = `Student: ${nameVal || 'N/A'} | Register No: ${regVal || 'N/A'}`;
                metaDiv.style.display = 'block';
            } else {
                metaDiv.style.display = 'none';
            }

            // Build individual GPA matrix list
            const gpaGrid = document.getElementById('gpaGrid');
            gpaGrid.innerHTML = '';
            Object.keys(semesterStats).forEach(sem => {
                const card = document.createElement('div');
                card.className = 'gpa-card';
                card.innerHTML = `
                    <div class="title">Semester ${sem}</div>
                    <div class="value">${semesterStats[sem].toFixed(2)}</div>
                `;
                gpaGrid.appendChild(card);
            });

            document.getElementById('cgpaScore').textContent = finalCgpa.toFixed(2);
            document.getElementById('percentageScore').textContent = finalPercentage.toFixed(2) + '%';
            
            document.getElementById('resultsDashboard').style.display = 'block';
            
            // Auto scroll down smoothly to view visual results panels
            document.getElementById('resultsDashboard').scrollIntoView({ behavior: 'smooth' });
        } else {
            alert("Please make sure credits values entered are greater than zero.");
        }
    }
</script>

</body>
</html>
